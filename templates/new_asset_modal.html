<div id="asset-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4" hx-on::after-request="if(event.detail.successful) this.remove()">
    <div class="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-md p-6 shadow-[0_0_40px_rgba(0,0,0,0.5)]" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="flex items-center justify-between mb-6">
            <h2 id="modal-title" class="text-xl font-bold text-white">Novo Ativo</h2>
            <button
                onclick="this.closest('.modal-overlay').remove()"
                class="p-1 bg-white/5 border border-white/10 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-all duration-200"
                aria-label="Fechar"
            >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <form
            hx-post="/api/assets"
            hx-target="#modal-container"
            hx-swap="outerHTML"
            class="space-y-4"
        >
            <div>
                <label for="name" class="block text-sm text-slate-300 mb-1.5">Nome do Ativo</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    placeholder="Ex: Bitcoin, PETR4, IVVB11"
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 input-focus transition-all duration-300"
                    autocomplete="off"
                >
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="unit_value" class="block text-sm text-slate-300 mb-1.5">Valor Unitário (R$)</label>
                    <input
                        type="number"
                        id="unit_value"
                        name="unit_value"
                        required
                        step="0.01"
                        min="0.01"
                        placeholder="0,00"
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 input-focus transition-all duration-300"
                    >
                </div>
                <div>
                    <label for="quantity" class="block text-sm text-slate-300 mb-1.5">Quantidade</label>
                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        required
                        step="0.00000001"
                        min="0"
                        placeholder="0"
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 input-focus transition-all duration-300"
                    >
                </div>
            </div>

            <div class="flex gap-3 pt-2">
                <button
                    type="button"
                    onclick="this.closest('.modal-overlay').remove()"
                    class="flex-1 px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-slate-300 font-medium hover:bg-white/10 hover:text-white transition-all duration-300"
                >
                    Cancelar
                </button>
                <button
                    type="submit"
                    class="flex-1 btn-primary px-4 py-3 bg-cyan-500/20 border border-cyan-400/30 rounded-xl text-cyan-400 font-medium transition-all duration-300"
                >
                    Salvar
                </button>
            </div>
        </form>
    </div>
</div>
