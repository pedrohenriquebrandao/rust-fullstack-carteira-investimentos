<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteira de Investimentos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * { font-family: 'Space Mono', monospace; }
        .glow-cyan { box-shadow: 0 0 20px rgba(34, 211, 238, 0.3); }
        .glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); }
        .input-focus:focus { border-color: #22d3ee; box-shadow: 0 0 15px rgba(34, 211, 238, 0.2); }
        .btn-primary:hover { background: rgba(34, 211, 238, 0.3); box-shadow: 0 0 20px rgba(34, 211, 238, 0.3); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.3); box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }
        .asset-row:hover { background: rgba(255, 255, 255, 0.03); }
        .modal-overlay { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-slate-950 min-h-screen" style="font-family: 'Space Mono', monospace;">
    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <header class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold text-white tracking-tight">Carteira de Investimentos</h1>
                <p class="text-slate-400 mt-1">Gerencie seus ativos e acompanhe seu patrimônio</p>
            </div>
            <div class="flex gap-3">
                <button
                    hx-get="/modal/new-asset"
                    hx-target="#modal-container"
                    class="btn-primary px-5 py-2.5 bg-cyan-500/20 border border-cyan-400/30 rounded-xl text-cyan-400 font-medium transition-all duration-300 flex items-center gap-2"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Novo Ativo
                </button>
            </div>
        </header>

        <div id="portfolio-summary" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 glow-green">
                <div class="text-slate-400 text-sm mb-1">Patrimônio Total</div>
                <div id="total-value" class="text-3xl md:text-4xl font-bold text-green-400">R$ 0,00</div>
            </div>
            <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 glow-cyan">
                <div class="text-slate-400 text-sm mb-1">Total de Ativos</div>
                <div id="total-assets" class="text-3xl md:text-4xl font-bold text-cyan-400">0</div>
            </div>
            <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6">
                <div class="text-slate-400 text-sm mb-1">Ativos com Posição</div>
                <div id="assets-with-position" class="text-3xl md:text-4xl font-bold text-white">0</div>
            </div>
        </div>

        <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-white/5 border-b border-white/10">
                        <tr class="text-left text-slate-400 text-sm uppercase tracking-wider">
                            <th class="px-6 py-4">Ativo</th>
                            <th class="px-6 py-4 text-right">Quantidade</th>
                            <th class="px-6 py-4 text-right">Valor Unitário</th>
                            <th class="px-6 py-4 text-right">Valor Total</th>
                            <th class="px-6 py-4 text-right">% Carteira</th>
                            <th class="px-6 py-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="assets-table" class="divide-y divide-white/5">
                        <tr class="asset-row transition-colors duration-200">
                            <td colspan="6" class="px-6 py-12 text-center text-slate-500">Carregando ativos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="hidden px-6 py-12 text-center">
                <svg class="w-16 h-16 mx-auto text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <p class="text-slate-400 mb-4">Nenhum ativo cadastrado</p>
                <button
                    hx-get="/modal/new-asset"
                    hx-target="#modal-container"
                    class="btn-primary px-5 py-2.5 bg-cyan-500/20 border border-cyan-400/30 rounded-xl text-cyan-400 font-medium transition-all duration-300 inline-flex items-center gap-2"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Adicionar Primeiro Ativo
                </button>
            </div>
        </div>
    </div>

    <div id="modal-container"></div>

    <script>
        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL',
                minimumFractionDigits: 2
            }).format(value);
        }

        function formatNumber(value) {
            return new Intl.NumberFormat('pt-BR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 8
            }).format(value);
        }

        function formatPercent(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'percent',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(value);
        }

        async function loadAssets() {
            try {
                const response = await fetch('/api/assets');
                const assets = await response.json();
                renderAssets(assets);
                updateSummary(assets);
            } catch (error) {
                console.error('Erro ao carregar ativos:', error);
                document.getElementById('assets-table').innerHTML = `
                    <tr class="asset-row">
                        <td colspan="6" class="px-6 py-12 text-center text-red-400">Erro ao carregar ativos</td>
                    </tr>
                `;
            }
        }

        function renderAssets(assets) {
            const tbody = document.getElementById('assets-table');
            const emptyState = document.getElementById('empty-state');

            if (!assets || assets.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            const totalValue = assets.reduce((sum, a) => sum + (a.unit_value * a.quantity), 0);

            tbody.innerHTML = assets.map(asset => {
                const assetValue = asset.unit_value * asset.quantity;
                const percentage = totalValue > 0 ? (assetValue / totalValue) : 0;

                return `
                    <tr class="asset-row transition-colors duration-200" data-asset-id="${asset.id}">
                        <td class="px-6 py-4">
                            <div class="font-medium text-white">${asset.name}</div>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <span class="text-slate-300 font-mono">${formatNumber(asset.quantity)}</span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <span class="text-slate-300 font-mono">${formatCurrency(asset.unit_value)}</span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <span class="text-white font-medium">${formatCurrency(assetValue)}</span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <span class="text-cyan-400 font-medium">${formatPercent(percentage)}</span>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <button
                                    hx-get="/modal/edit-asset/${asset.id}"
                                    hx-target="#modal-container"
                                    class="p-2 bg-cyan-500/10 border border-cyan-400/20 rounded-lg text-cyan-400 hover:bg-cyan-500/20 hover:border-cyan-400/40 transition-all duration-200"
                                    title="Editar"
                                >
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                </button>
                                <button
                                    hx-delete="/api/assets/${asset.id}"
                                    hx-confirm="Tem certeza que deseja excluir ${asset.name}?"
                                    hx-target="closest tr"
                                    hx-swap="outerHTML swap:1s"
                                    class="p-2 bg-red-500/10 border border-red-400/20 rounded-lg text-red-400 hover:bg-red-500/20 hover:border-red-400/40 transition-all duration-200"
                                    title="Excluir"
                                >
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateSummary(assets) {
            const totalValue = assets.reduce((sum, a) => sum + (a.unit_value * a.quantity), 0);
            const totalAssets = assets.length;
            const assetsWithPosition = assets.filter(a => a.quantity > 0).length;

            document.getElementById('total-value').textContent = formatCurrency(totalValue);
            document.getElementById('total-assets').textContent = totalAssets;
            document.getElementById('assets-with-position').textContent = assetsWithPosition;
        }

        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'modal-container') {
                const modal = document.getElementById('asset-modal');
                if (modal) {
                    modal.focus();
                    const firstInput = modal.querySelector('input');
                    if (firstInput) firstInput.focus();
                }
            }
        });

        document.body.addEventListener('htmx:afterRequest', function(evt) {
            if (evt.detail.pathInfo.requestPath.startsWith('/api/assets') &&
                ['POST', 'PATCH', 'DELETE'].includes(evt.detail.pathInfo.requestMethod)) {
                loadAssets();
            }
        });

        loadAssets();
    </script>
</body>
</html>
